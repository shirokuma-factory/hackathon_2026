[project]
name = "shipcompare"
version = "0.1.0"
description = "Backfull: 中小荷主のスポット出荷 比較・依頼ツール"
requires-python = ">=3.13"
dependencies = [
    "anthropic>=2.6.0",
    "streamlit>=1.40",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-xdist>=3.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shipcompare"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
