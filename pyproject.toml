[project]
name = "shipcompare"
version = "0.1.0"
description = "Backfull: 中小の運送会社と荷主のための物流ツール（荷待ちの協議の書面、帰り便の偏りとつなぎ、送り方の比較）"
requires-python = ">=3.13"
dependencies = [
    "anthropic>=2.6.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-xdist>=3.8.0",
    "websockets>=13",
    "pillow>=10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shipcompare"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
