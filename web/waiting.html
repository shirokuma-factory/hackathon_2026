<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>荷待ち・荷役の記録から協議の書面を作る</title>
<!-- このファイルは tools/build_waiting_page.py が tools/waiting_page_template.html から作ります。直すときはテンプレートを直してください。 -->
<style>
:root { --bg: #f6f7f9; --card: #fff; --text: #1d2330; --muted: #5b6475; --faint: #8a93a3; --line: #d9dde5; --accent: #1b5fbf; --warn: #b3261e; --warn-bg: #fdecea; --hi: #eef4fd; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.65 "Noto Sans JP", "Yu Gothic UI", "Hiragino Sans", Meiryo, sans-serif; }
header.top { padding: 14px 24px 8px; }
header.top h1 { margin: 0 0 4px; font-size: 20px; }
header.top p { margin: 0; color: var(--muted); font-size: 13px; }
.protect { margin: 6px 24px 12px; padding: 8px 14px; border: 2px solid var(--text); border-radius: 8px; background: var(--card); font-weight: 700; font-size: 13px; }
.protect p { margin: 2px 0; }
main { display: grid; grid-template-columns: minmax(0, 800px) minmax(0, 1fr); gap: 16px; padding: 0 24px 24px; align-items: start; }
@media (max-width: 1500px) { main { grid-template-columns: minmax(0, 1fr); } }
section.card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin-bottom: 14px; }
section.card h2 { margin: 0 0 6px; font-size: 15px; }
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; margin: 6px 0; font-size: 13px; }
.bar small, .small { color: var(--muted); font-size: 12px; }
button { font: inherit; font-size: 13px; padding: 4px 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--card); color: var(--text); cursor: pointer; }
button:hover { background: var(--hi); }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
button.primary:hover { background: #164f9f; }
select, input[type=text], textarea { font: inherit; font-size: 12.5px; color: var(--text); background: #fff; border: 1px solid var(--line); border-radius: 5px; }
.tw { overflow: auto; max-height: 440px; border: 1px solid var(--line); border-radius: 8px; }
table.in { border-collapse: collapse; width: 100%; font-size: 12.5px; }
table.in th { position: sticky; top: 0; z-index: 1; background: #eceff4; text-align: left; font-weight: 500; font-size: 11px; color: var(--muted); padding: 4px 4px; border-bottom: 1px solid var(--line); line-height: 1.3; }
table.in td { padding: 2px; border-bottom: 1px solid #eceff4; }
table.in td.n { color: var(--faint); text-align: right; padding: 0 6px; font-size: 11px; }
table.in tr.bad td { background: var(--warn-bg); }
table.in input, table.in select { width: 100%; height: 26px; padding: 0 4px; }
.del { border: 0; background: transparent; color: var(--faint); padding: 0 6px; }
.errs { margin: 6px 0; padding: 8px 10px; border: 1px solid var(--warn); border-radius: 8px; background: var(--warn-bg); color: var(--warn); font-size: 12.5px; }
.errs b { display: block; }
details { margin-top: 8px; }
details summary { cursor: pointer; font-weight: 700; font-size: 13px; }
textarea { width: 100%; padding: 6px 8px; resize: vertical; }
table.par, table.rec { width: 100%; border-collapse: collapse; font-size: 12.5px; margin: 6px 0; }
table.par th, table.rec th { text-align: right; font-weight: 500; color: var(--muted); font-size: 11.5px; padding: 4px 6px; border-bottom: 1px solid var(--line); line-height: 1.35; }
table.par th:first-child, table.rec th:first-child { text-align: left; }
table.par td, table.rec td { padding: 4px 6px; border-bottom: 1px solid #eceff4; }
td.num { text-align: right; font-variant-numeric: tabular-nums; }
table.par tr[data-pick] { cursor: pointer; }
table.par tr.on td { background: var(--hi); }
table.rec td, table.rec th { white-space: nowrap; }
.rec-w { overflow-x: auto; }
table.rec small, table.rec th small { display: block; color: var(--faint); font-size: 10.5px; font-weight: 400; }
.wrap { display: flex; gap: 14px; align-items: flex-start; }
#wait-doc { flex: 1 1 0; min-width: 0; border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; background: #fff; }
#wait-doc h3 { margin: 0 0 8px; font-size: 16px; }
#wait-doc h4 { margin: 12px 0 2px; font-size: 13px; }
#wait-doc p { margin: 4px 0; }
dl.dl { display: grid; grid-template-columns: 56px 1fr; gap: 2px 8px; margin: 0; }
dl.dl dt { color: var(--faint); font-size: 12px; } dl.dl dd { margin: 0; }
ul.list { margin: 4px 0; padding-left: 18px; }
.sentence { margin-top: 10px; padding: 8px 10px; border-left: 4px solid var(--accent); background: var(--hi); font-weight: 700; }
aside#process { flex: 0 0 270px; border: 1px solid var(--accent); border-radius: 8px; background: var(--hi); padding: 10px 12px; font-size: 12.5px; position: sticky; top: 8px; }
aside#process b { display: block; margin-bottom: 4px; font-size: 13.5px; }
aside#process ul { margin: 0; padding-left: 16px; } aside#process li { margin-bottom: 6px; overflow-wrap: anywhere; }
.basis ul { margin: 4px 0 0; padding-left: 18px; font-size: 12.5px; color: var(--muted); }
.empty { color: var(--muted); margin: 10px 2px; }
#selftest { display: none; margin: 8px 24px; padding: 8px 12px; border: 2px solid var(--text); border-radius: 8px; background: var(--card); font-weight: 700; white-space: pre-wrap; }
body.selftest #selftest { display: block; }
@media print {
  body { background: #fff; }
  body * { visibility: hidden; }
  #wait-doc, #wait-doc * { visibility: visible; color: #000; }
  #wait-doc { position: absolute; left: 0; top: 0; width: 100%; border: 0; padding: 0; font-size: 12pt; }
  #wait-doc .sentence { border-left: 4px solid #000; background: none; }
}
</style>
</head>
<body>
<header class="top">
  <h1>荷待ち・荷役の記録から、契約の相手との協議の書面を作る</h1>
  <p>運送会社が自社の記録を手で入れて使うページです。サーバーも インストールも要りません。ファイルを開くだけで動きます。</p>
</header>
<div class="protect" id="protect"></div>
<main>
  <div class="col-in">
    <section class="card" id="input">
      <h2>荷待ち・荷役の記録を入れる</h2>
      <p class="small">運送を頼まれた相手ごとに入れます。1 行 = 1 か所での 1 回の荷待ち・荷役です。指定の到着時刻と附帯業務は、あるときだけ入れます。</p>
      <div class="bar">
        <label>年（M/D で入れた日付に使います）<select id="year"></select></label>
        <button type="button" id="b-example">例を入れる</button>
        <button type="button" id="b-clear">表を空にする</button>
      </div>
      <div class="tw"><table class="in" aria-label="荷待ち・荷役の記録の表"><thead id="thead"></thead><tbody id="tbody"></tbody></table></div>
      <div class="bar"><button type="button" id="b-add">行を足す</button><small>時刻は HH:MM（日付をまたぐ時刻は翌日として扱います）。荷役終了は荷役をしたときに入れます。</small></div>
      <div id="errs"></div>
      <details open>
        <summary>Excel から貼り付ける</summary>
        <p class="small">Excel の表をコピーして貼り付けます（タブ区切り。列の順は上の表と同じで、1 行目が見出しなら読み飛ばします）。</p>
        <textarea id="paste" rows="3" placeholder="ここに貼り付け" aria-label="Excel から貼り付ける欄"></textarea>
        <div class="bar"><button type="button" id="b-paste">貼り付けた内容を表に入れる</button><span class="small" id="paste-msg"></span></div>
      </details>
    </section>
    <section class="card basis" id="basis"></section>
  </div>
  <div class="col-out">
    <section class="card res" id="result">
      <div id="partners"></div>
      <div id="draft-area"></div>
    </section>
  </div>
</main>
<div id="selftest" role="status"></div>

const norm = (s) => String(s == null ? '' : s).trim();

function normalizeClass(raw) {
  const key = raw.replace(/[\s（）()]/g, '').toLowerCase();
  if (Object.prototype.hasOwnProperty.call(CLASS_ALIASES, key)) return CLASS_ALIASES[key];
  for (const name of ['トレーラー', '小型', '中型', '大型']) if (key.startsWith(name.toLowerCase())) return name;
  return null;
}

function parseTime(text) {
  const m = /^(\d{1,2})[:：](\d{2})$/.exec(text.trim());
  if (!m) return null;
  const h = Number(m[1]), mi = Number(m[2]);
  if (h > 23 || mi > 59) return null;
  return h * 60 + mi;
}

function mkDate(y, mo, d) {
  if (y < 1 || y > 9999 || mo < 1 || mo > 12 || d < 1) return null;
  const dt = new Date(Date.UTC(2000, mo - 1, 1));
  dt.setUTCFullYear(y);
  dt.setUTCMonth(mo - 1, d);
  if (dt.getUTCFullYear() !== y || dt.getUTCMonth() !== mo - 1 || dt.getUTCDate() !== d) return null;
  return `${String(y).padStart(4, '0')}-${String(mo).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
}

function parseDate(text, year) {
  const t = text.trim();
  let m = /^(\d{4})[-/](\d{1,2})[-/](\d{1,2})$/.exec(t);
  if (m) return mkDate(Number(m[1]), Number(m[2]), Number(m[3]));
  m = /^(\d{1,2})\/(\d{1,2})$/.exec(t);
  if (m && year != null) return mkDate(year, Number(m[1]), Number(m[2]));
  return null;
}

function toBool(raw) {
  const k = raw.trim().toLowerCase();
  if (YES.has(k)) return true;
  if (NO.has(k)) return false;
  return null;
}

function parsePaste(text) {
  const lines = String(text || '').replace(/\r\n/g, '\n').replace(/\r/g, '\n').split('\n').filter((ln) => ln.trim());
  if (!lines.length) return [];
  let cols = COLUMNS.slice();
  let body = lines;
  const first = lines[0].split('\t').map((c) => c.trim());
  const known = first.filter((c) => Object.prototype.hasOwnProperty.call(HEADER_ALIASES, c)).length;
  if (first.length && (first[0] === '日付' || first[0] === 'date' || known >= 3)) {
    const mapped = first.map((c) => (Object.prototype.hasOwnProperty.call(HEADER_ALIASES, c) ? HEADER_ALIASES[c] : null));
    if (mapped.filter((c) => c).length >= 6) cols = mapped.map((c, i) => c || `_extra${i}`);
    body = lines.slice(1);
  }
  return body.map((ln) => {
    const cells = ln.split('\t'), o = {};
    for (let i = 0; i < Math.min(cols.length, cells.length); i++) o[cols[i]] = cells[i].trim();
    return o;
  });
}

const ceilDiv = (a, b) => (a > 0 ? Math.ceil(a / b) : 0);

function calcRow(n, raw, year, tariff) {

      else errs.push(`日付「${g.date}」を読めません（YYYY-MM-DD か M/D で入れてください）`);
    }
  }

  let vclass = null;
  if (!g.vehicle_class) errs.push('車種がありません');
  else {
    vclass = normalizeClass(g.vehicle_class);
    if (vclass === null) errs.push(`車種「${g.vehicle_class}」を読めません（小型（2t）/ 中型（4t）/ 大型（10t）/ トレーラー）`);
  }
  if (!g.partner) errs.push('契約の相手がありません');

    if (!g[key]) { if (required) errs.push(`${label}がありません`); return null; }

    if (v === null) errs.push(`${label}「${g[key]}」を読めません（HH:MM で入れてください）`);

  };
  const arrive = needTime('arrive', '到着', true);

  else {
    fault = toBool(g.shipper_fault);
    if (fault === null) errs.push(`荷主等の都合の待機か「${g.shipper_fault}」を読めません（はい / いいえ）`);
  }
  if (errs.length) return { res: null, errs };

  let sRel = start - arrive, crosses = false;
  if (sRel < 0) { sRel += 1440; crosses = true; }
  let eRel = null;
  if (end !== null) {
    eRel = end - arrive;
    while (eRel < sRel) { eRel += 1440; crosses = true; }
  }
  if (depart !== null) {
    let depRel = depart - arrive;
    const floor = eRel !== null ? eRel : sRel;
    while (depRel < floor) { depRel += 1440; crosses = true; }
  }
  const handlingMin = eRel !== null ? eRel - sRel : 0;

  const unit = tariff.unit_minutes, free = tariff.free_minutes, thr = tariff.threshold_minutes;

  // 待機の始まり = max(到着, 指定の到着時刻)。指定との差は 12 時間以内の近い側に取る（SPEC §23.7）
  let base = 0;
  if (appointed !== null) {
    let diff = appointed - arrive;
    if (diff > 720) diff -= 1440;
    else if (diff < -720) diff += 1440;
    base = Math.max(0, diff);
  }
  const boundary = base + thr;

  let waitRaw;
  if (handler === '荷主側') waitRaw = Math.max(0, eRel - Math.max(sRel, base)) + Math.max(0, sRel - base);
  else waitRaw = Math.max(0, sRel - base);
  const w = fault ? waitRaw : 0;
  const wnMin = Math.max(0, Math.min(w, thr) - free);
  const woMin = Math.max(0, w - thr);
  const wnUnits = ceilDiv(wnMin, unit), woUnits = ceilDiv(woMin, unit);
  const wnRate = tariff.waiting.normal[vclass], woRate = tariff.waiting.over_2h[vclass];
  const waitFee = wnUnits * wnRate + woUnits * woRate;

  let hnUnits = 0, hoUnits = 0, hnRate = 0, hoRate = 0, driverHandlingMin = 0;
  if (handler === '運転者') {
    driverHandlingMin = handlingMin;
    const before = Math.max(0, Math.min(eRel, boundary) - Math.min(sRel, boundary));
    const after = Math.max(0, eRel - Math.max(sRel, boundary));
    hnUnits = ceilDiv(before, unit); hoUnits = ceilDiv(after, unit);
    hnRate = tariff.handling[method].normal[vclass];
    hoRate = tariff.handling[method].over_2h[vclass];
  }
  const handlingFee = hnUnits * hnRate + hoUnits * hoRate;

  return {
    res: {
      row: n, date: d, month: d.slice(0, 7), vehicle_no: g.vehicle_no, vehicle_class: vclass, partner: g.partner, place: g.place,
      arrive: g.arrive, start: g.start, end: g.end, depart: g.depart,
      appointed: g.appointed, wait_from: base > 0 ? '指定の到着時刻' : '到着', wait_base_min: base,
      side_work: g.side_work, side_min: sideMin,
      handler, method, shipper_fault: fault, crosses_midnight: crosses,
      wait_raw_min: sRel, wait_min: w, handling_min: driverHandlingMin,
      wait_normal_units: wnUnits, wait_normal_rate: wnRate, wait_over_units: woUnits, wait_over_rate: woRate, wait_fee: waitFee,
      handling_normal_units: hnUnits, handling_normal_rate: hnRate, handling_over_units: hoUnits, handling_over_rate: hoRate, handling_fee: handlingFee,
      amount: waitFee + handlingFee,
      over_1h: w >= 60, over_2h_total: (w + driverHandlingMin) >= thr,
      has_side_work: !!g.side_work || sideMin > 0,
    },
    errs: [],
  };
}

function sumRows(rows) {
  const s = (f) => rows.reduce((a, r) => a + f(r), 0);
  return {
    count: rows.length, wait_minutes: s((r) => r.wait_min), handling_minutes: s((r) => r.handling_min),
    wait_fee: s((r) => r.wait_fee), handling_fee: s((r) => r.handling_fee), amount: s((r) => r.amount),
    over_1h_count: s((r) => (r.over_1h ? 1 : 0)), over_2h_count: s((r) => (r.over_2h_total ? 1 : 0)),
    side_work_count: s((r) => (r.has_side_work ? 1 : 0)), side_work_minutes: s((r) => r.side_min),
  };
}

const cmp = (a, b) => (a < b ? -1 : a > b ? 1 : 0);

function aggregate(rows) {
  const by = new Map();
  for (const r of rows) { if (!by.has(r.partner)) by.set(r.partner, []); by.get(r.partner).push(r); }
  const out = [];
  for (const [name, rs] of by) {
    const months = [...new Set(rs.map((r) => r.month))].sort(cmp).map((m) => ({ month: m, ...sumRows(rs.filter((r) => r.month === m)) }));
    const dates = rs.map((r) => r.date).sort(cmp);
    out.push({ partner: name, ...sumRows(rs), date_from: dates[0], date_to: dates[dates.length - 1], months });
  }
  out.sort((a, b) => (b.amount - a.amount) || cmp(a.partner, b.partner));
  return out;
}

function calc(rows, year, tariff) {
  if (rows.length > MAX_ROWS) throw new Error(`行が多すぎます（${MAX_ROWS.toLocaleString('ja-JP')} 行まで）`);
  const done = [], errors = [];
  rows.forEach((raw, i) => {
    const n = i + 1;
    if (raw === null || typeof raw !== 'object' || Array.isArray(raw)) { errors.push({ row: n, message: '行の形が正しくありません' }); return; }
    const { res, errs } = calcRow(n, raw, year, tariff);
    if (res === null) errs.forEach((e) => errors.push({ row: n, message: e })); else done.push(res);
  });
  return { rows: done, by_partner: aggregate(done), errors };
}

/* ---------------------------------------------------------------- 自己確認（?selftest=1） */
function deepEqual(a, b) {
  if (a === b) return true;
  if (typeof a !== typeof b || a === null || b === null || typeof a !== 'object') return false;
  if (Array.isArray(a) !== Array.isArray(b)) return false;
  if (Array.isArray(a)) return a.length === b.length && a.every((x, i) => deepEqual(x, b[i]));
  const ka = Object.keys(a), kb = Object.keys(b);
  return ka.length === kb.length && ka.every((k) => Object.prototype.hasOwnProperty.call(b, k) && deepEqual(a[k], b[k]));
}

function runSelftest() {
  const fails = [];
  for (const c of VECTORS.cases) {
    const rows = c.paste ? parsePaste(c.text) : c.rows;
    const got = calc(rows, c.year, TARIFF);
    const exp = c.expect;
    const out = { rows: got.rows, by_partner: got.by_partner, errors: got.errors };
    if (c.paste) out.input_rows = rows;
    if (!deepEqual(out, exp)) {
      const bad = Object.keys(exp).filter((k) => !deepEqual(out[k], exp[k]));
      fails.push(`${c.name}（${bad.join(', ')}）`);
    }
  }
  const n = VECTORS.cases.length;
  return fails.length ? `SELFTEST FAIL ${n - fails.length}/${n}\n${fails.join('\n')}` : `SELFTEST PASS ${n}/${n}`;
}

function collectRows() {
  S.idxMap = [];
  const rows = [];
  S.rows.forEach((r, i) => { if (!isBlank(r)) { rows.push({ ...r }); S.idxMap.push(i); } });
  return rows;
}

function doCalc() {
  const rows = collectRows();
  if (!rows.length) { S.res = null; S.err = ''; } else {
    try { S.res = calc(rows, S.year, TARIFF); S.err = ''; } catch (e) { S.res = null; S.err = e.message; }
  }
  S.bad = new Set(S.res ? S.res.errors.map((e) => S.idxMap[e.row - 1]) : []);
  document.querySelectorAll('#tbody tr').forEach((tr) => tr.classList.toggle('bad', S.bad.has(Number(tr.dataset.i))));
  $('#errs').innerHTML = errsHtml();
  renderResult();
}

  const cell = (v) => { const t = String(v == null ? '' : v); return /[",\r\n]/.test(t) ? `"${t.replace(/"/g, '""')}"` : t; };
  const lines = [heads, ...S.res.rows.map((r) => [r.date, r.vehicle_no, r.vehicle_class, r.partner, r.place, r.arrive, r.start, r.end, r.depart, r.handler, r.method, r.shipper_fault ? 'はい' : 'いいえ',

}

    const t = e.target;
    if (t.id === 'b-example') { S.rows = exampleRows(); renderTable(); doCalc(); }
    else if (t.id === 'b-clear') { S.rows = [blankRow(), blankRow(), blankRow()]; S.res = null; S.err = ''; S.bad = new Set(); renderTable(); $('#errs').innerHTML = ''; renderResult(); }
    else if (t.id === 'b-add') { S.rows.push(blankRow()); renderTable(); const ins = document.querySelectorAll('#tbody tr:last-child .w-in'); if (ins[0]) ins[0].focus(); }
    else if (t.id === 'b-paste') pasteIn();
    else if (t.id === 'b-print') window.print();
    else if (t.id === 'b-csv') { if (S.res && S.res.rows.length) downloadCsv(); }
    else if (t.dataset && t.dataset.del !== undefined) { S.rows.splice(Number(t.dataset.del), 1); renderTable(); doCalc(); }
    else { const tr = t.closest && t.closest('tr[data-pick]'); if (tr) { S.partner = tr.dataset.pick; renderResult(); } }
  });
  const qs = new URLSearchParams(location.search);
  if (qs.get('selftest') === '1') {
    document.body.classList.add('selftest');
    let text;
    try { text = runSelftest(); } catch (e) { text = `SELFTEST FAIL ${e.message}`; }
    $('#selftest').textContent = text;
    document.title = text.split('\n')[0];
  }
  if (qs.get('example') === '1') { S.rows = exampleRows(); renderTable(); doCalc(); }
}

init();
</script>
</body>
</html>
