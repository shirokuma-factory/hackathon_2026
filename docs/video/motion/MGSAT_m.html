<!doctype html><html lang="ja"><head><meta charset="utf-8"><title>MGSAT_m</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;background:transparent;overflow:hidden}
body{font-family:"Noto Sans JP","Yu Gothic","Meiryo",sans-serif;color:#fff;line-height:1.3}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px}
.layer{position:absolute;left:0;top:0;width:1920px;height:1080px}
svg{position:absolute;left:0;top:0;overflow:visible}
.sh{text-shadow:0 4px 22px rgba(0,0,0,.65),0 0 5px rgba(0,0,0,.45)}
</style></head><body data-duration="9.0">
<div id="stage"><div class="layer" id="bg"></div><div class="layer" id="fig"></div><div class="layer" id="txt"></div></div>
<script src="mkit_m.js"></script>
<script>
/* C1「さつま運輸。帰りが、空のまま走ること。荷待ちで、時間を取られること。そして……それを荷主に、言い出しにくいこと。」の図（r19）。
   作成者の指摘 11/8: さつま運輸の困りごとが抜けている（地図の画面に字幕だけで、困りごとが絵で分からなかった）。
   0 秒 = 「帰りが」の 0.3 秒前（build の at say「帰りが」land 0.3）。各項目は C1 の声の時刻（tight_r9、1.12 倍）:
   「荷待ちで」+2.2 秒、「言い出しにくい」+6.8 秒 */
(function () {
  var K = window.K, P = K.P, E = K.E, D = 9.0;
  var TM = {a: 0.3, b: 2.5, c: 7.0};
  var WHITE = '#ffffff', YEL = '#f0c04a', RED = '#ff8a5c';
  var fig = document.getElementById('fig'), txt = document.getElementById('txt');
  var sv = K.el('svg', { width: 1920, height: 1080, viewBox: '0 0 1920 1080' }, fig);
  var XS = [400, 960, 1520], IY = 430;
  var g = XS.map(function () { return K.el('g', {}, sv); });
  /* ① 空の荷台のトラック */
  (function (p, x) {
    K.el('rect', { x: x - 170, y: IY - 90, width: 230, height: 130, rx: 8, fill: 'none', stroke: YEL, 'stroke-width': 6, 'stroke-dasharray': '16 12' }, p);
    K.el('path', { d: 'M' + (x + 70) + ' ' + (IY - 50) + ' h60 l40 50 v40 h-100 z', fill: 'none', stroke: WHITE, 'stroke-width': 6, 'stroke-linejoin': 'round' }, p);
    K.el('line', { x1: x - 180, y1: IY + 54, x2: x + 180, y2: IY + 54, stroke: WHITE, 'stroke-width': 6, 'stroke-linecap': 'round' }, p);
    [x - 110, x + 10, x + 130].forEach(function (cx) { K.el('circle', { cx: cx, cy: IY + 74, r: 20, fill: '#0b1016', stroke: WHITE, 'stroke-width': 5 }, p); });
  })(g[0], XS[0]);
  /* ② 時計 */
  var hand;
  (function (p, x) {
    K.el('circle', { cx: x, cy: IY, r: 110, fill: 'none', stroke: WHITE, 'stroke-width': 7 }, p);
    for (var i = 0; i < 12; i++) {
      var a = i * Math.PI / 6;
      K.el('line', { x1: x + 92 * Math.sin(a), y1: IY - 92 * Math.cos(a), x2: x + 104 * Math.sin(a), y2: IY - 104 * Math.cos(a), stroke: WHITE, 'stroke-width': 4 }, p);
    }
    K.el('line', { x1: x, y1: IY, x2: x, y2: IY - 58, stroke: WHITE, 'stroke-width': 7, 'stroke-linecap': 'round' }, p);
    hand = K.el('line', { x1: x, y1: IY, x2: x, y2: IY - 86, stroke: YEL, 'stroke-width': 6, 'stroke-linecap': 'round' }, p);
    K.el('circle', { cx: x, cy: IY, r: 9, fill: YEL }, p);
  })(g[1], XS[1]);
  /* ③ 言えない吹き出し */
  (function (p, x) {
    K.el('path', { d: 'M' + (x - 150) + ' ' + (IY - 90) + ' h300 a20 20 0 0 1 20 20 v130 a20 20 0 0 1 -20 20 h-190 l-50 46 v-46 h-60 a20 20 0 0 1 -20 -20 v-130 a20 20 0 0 1 20 -20 z', fill: 'none', stroke: WHITE, 'stroke-width': 6, 'stroke-linejoin': 'round' }, p);
    [-60, 0, 60].forEach(function (dx) { K.el('circle', { cx: x + dx, cy: IY - 5, r: 13, fill: RED }, p); });
  })(g[2], XS[2]);
  function T(x, y, size, weight, color, html) {
    var d = K.div(txt, 'left:' + (x - 300) + 'px;width:600px;top:' + y + 'px;text-align:center;font-size:' + size + 'px;font-weight:' + weight + ';color:' + color + ';letter-spacing:.03em', html);
    d.className = 'sh'; d.style.opacity = 0; return d;
  }
  var head = T(960, 150, 44, 700, WHITE, 'さつま運輸の<span style="color:' + YEL + '">困りごと</span>');
  var labs = [
    T(XS[0], 600, 50, 800, WHITE, '<span style="color:' + YEL + '">①</span> 帰りが<br>空のまま走る'),
    T(XS[1], 600, 50, 800, WHITE, '<span style="color:' + YEL + '">②</span> 荷待ちで<br>時間を取られる'),
    T(XS[2], 600, 50, 800, WHITE, '<span style="color:' + YEL + '">③</span> 荷主に<br><span style="color:' + RED + '">言い出しにくい</span>')
  ];
  var starts = [TM.a, TM.b, TM.c];
  function render(s) {
    K.show(head, P(s, 0.0, 0.5), 0, 12);
    starts.forEach(function (t0, i) {
      var p = P(s, t0, 0.5, E.out);
      g[i].style.opacity = p;
      g[i].setAttribute('transform', 'translate(0 ' + (24 * (1 - p)) + ')');
      K.show(labs[i], p, 0, 18);
    });
    /* 待つ間、時計の長針が回る */
    var r = Math.max(0, s - TM.b) * 140;
    hand.setAttribute('transform', 'rotate(' + r + ' ' + XS[1] + ' ' + IY + ')');
  }
  K.setup(D, render);
})();
</script></body></html>
