<!doctype html><html lang="ja"><head><meta charset="utf-8"><title>MG3_m</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;background:transparent;overflow:hidden}
body{font-family:"Noto Sans JP","Yu Gothic","Meiryo",sans-serif;color:#fff;font-weight:700}
#stage,.L{position:absolute;left:0;top:0;width:1920px;height:1080px}
.L{transform-origin:96px 160px}
</style></head><body data-duration="8.0">
<div id="stage"><div id="bg" class="L"></div><div id="fig" class="L"></div><div id="txt" class="L"></div></div>
<script src="mkit_m.js"></script>
<script>
(function(){
var K=window.K,P=K.P,E=K.E,D=8.0;
var bg=document.getElementById('bg'),fig=document.getElementById('fig'),txt=document.getElementById('txt');
/* 背景: 上から透けるほどの暗幕と、細い横線 */
var scrim=K.div(bg,'left:0;top:0;width:1920px;height:760px;background:linear-gradient(180deg,rgba(5,8,12,.74) 0%,rgba(5,8,12,.55) 55%,rgba(5,8,12,0) 100%)');
var hl=[];[170,740].forEach(function(y){hl.push(K.div(bg,'left:96px;top:'+y+'px;width:1728px;height:1px;background:rgba(255,255,255,.10);transform-origin:left;'));});
/* 図 */
var svg=K.el('svg',{width:1920,height:1080,viewBox:'0 0 1920 1080'},fig);
var emp={},i;for(i=0;i<20;i++)emp[(i*19)%53]=true;
var icons=[],GX=96,GY=232,PX=112,PY=84;
for(i=0;i<53;i++){
  var r=Math.floor(i/9),c=i%9,g=K.el('g',{},svg),t=K.truck(g,3.5);
  icons.push({g:g,t:t,x:GX+c*PX,y:GY+r*PY,r:r,c:c,e:!!emp[i]});
}
var mt=K.motif(svg,1170,1440,1824,672,10);
/* 文字 */
var title=K.div(txt,'left:96px;top:92px;font-size:64px;line-height:1.2;font-weight:900','さつま運輸 10月の帰り便');
var tag=K.div(txt,'left:900px;top:108px;font-size:28px;line-height:1;font-weight:700;color:#9fb0c1;padding:10px 18px;border:1px solid #2a3745;border-radius:999px;background:rgba(18,26,35,.88)','架空の見本');
var sub=K.div(txt,'left:1170px;top:268px;font-size:40px;line-height:1.2;font-weight:700;color:#fff','53便のうち');
var num=K.div(txt,'left:1170px;top:322px;font-size:240px;line-height:1;font-weight:900;color:#f0c04a;font-variant-numeric:tabular-nums');
var unit=K.div(txt,'left:1170px;top:430px;font-size:108px;line-height:1;font-weight:900;color:#f0c04a','便が空');
function render(s){
  var p=P(s,.2,.6);K.show(title,p,0,18);
  /* タグは題名の右 */
  tag.style.left=(96+title.offsetWidth+28)+'px';K.show(tag,P(s,.55,.4),0,10);
  hl.forEach(function(h,k){h.style.transform='scaleX('+P(s,.1+k*.1,.9,E.mov)+')';});
  var dim=P(s,3.5,.6);
  icons.forEach(function(o){
    var a=P(s,.9+(o.r+o.c)*.07,.35);
    o.g.setAttribute('transform','translate('+o.x+','+(o.y+18*(1-a))+')');
    var e=o.e?P(s,3.0+(o.r+o.c)*.06,.5,E.mov):0;
    o.g.setAttribute('opacity',a*(o.e?1:1-.5*dim));
    o.t.set(K.mix('#ffffff','#f0c04a',e),8*e,.10*e);
  });
  var pa=P(s,2.9,.6);
  K.show(sub,pa,60,0);
  var v=Math.round(20*P(s,3.3,1.3));
  num.innerHTML=K.cells(String(v));K.show(num,pa,60,0);
  unit.style.left=(1170+num.offsetWidth+8)+'px';unit.style.top='438px';num.style.top='322px';
  unit.style.fontSize='108px';
  K.show(unit,P(s,3.1,.6),60,0);
  mt.set(P(s,4.9,.6,E.mov),P(s,5.3,.5,E.mov),P(s,5.6,1.1,E.mov));
}
K.setup(D,render);
})();
</script></body></html>
