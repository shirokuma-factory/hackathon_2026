<!doctype html><html lang="ja"><head><meta charset="utf-8"><title>MG3</title><link rel="stylesheet" href="../graphics/common.css"><link rel="stylesheet" href="motion.css">
<style>
#grid{display:grid;grid-template-columns:repeat(9,56px);grid-auto-rows:56px;gap:8px;flex:none}
.sq{border-radius:6px;border:4px solid transparent;background:rgba(255,255,255,.08)}
.sq.on{background:var(--hl)}
.sq.empty{background:transparent;border-color:var(--warn)}
.big{font-size:60px;font-weight:700;line-height:1.3}
</style>
</head><body data-duration="8.0">
<div id="panel" class="wide">
<h1>播磨ライン運輸 10月の帰り便 <span class="sub" style="font-size:28px">架空の見本</span></h1>
<div style="display:flex;gap:56px;align-items:center">
 <div id="grid"></div>
 <div data-at="2.5" class="big">53 便のうち<br><span class="u warnc" style="font-size:72px">20 便が空<i class="ul" data-ul="3.8"></i></span></div>
</div>
<div data-at="5" style="margin-top:34px;font-size:36px;font-weight:500">木曜の夜に出た 5 便は　<span class="u warnc">帰りがすべて空<i class="ul" data-ul="5.4"></i></span></div>
</div>
<script>
/* 53 個の四角。0.5〜1.5 秒で順に青、20 個は 2.5 秒から順に黄の枠だけ（53 は素数なので i*19 mod 53 は重ならない） */
(function(){
  var empty={},k=0,i;
  for(i=0;i<20;i++) empty[(i*19)%53]=true;
  var g=document.getElementById('grid');
  for(i=0;i<53;i++){
    var d=document.createElement('div');
    d.dataset.fill=(0.5+i*(1.0/53)).toFixed(3);
    if(empty[i]){ d.dataset.empty=(2.5+k*0.04).toFixed(3); k++; }
    g.appendChild(d);
  }
})();
</script>
<script src="motion.js"></script></body></html>
