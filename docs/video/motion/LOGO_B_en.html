<!doctype html><html lang="en"><head><meta charset="utf-8"><title>LOGO_B_en</title><link rel="stylesheet" href="../graphics/common.css">
<style>
/* 作成者が選んだ案 B（11/7）: ゴシック体の文字と、行き（満載）・帰り（空きを埋める）の線 */
html,body{background:#05080c}
body{padding:0}
#wrap{position:absolute;left:0;top:0;width:1920px;height:1080px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.word{font-weight:800;font-size:190px;letter-spacing:-0.02em;line-height:1;margin-top:-120px;white-space:nowrap}
.word .b{color:#fff}
.word .f{color:#fff}
.bar{position:relative;width:860px;height:14px;margin-top:34px}
.bar div{position:absolute;top:0;height:14px;border-radius:7px}
#o{left:0;width:0;background:#fff}
#d{left:50%;width:0;background:repeating-linear-gradient(90deg,#3a4757 0 14px,transparent 14px 30px)}
#y{left:50%;width:0;background:var(--warn)}
.lab{display:flex;justify-content:space-between;width:860px;font-size:32px;color:var(--muted);margin-top:14px}
.lab span{opacity:0}
.tag{margin-top:40px;font-size:44px;color:var(--muted);letter-spacing:0.08em;opacity:0}
</style></head><body data-duration="6.0">
<div id="wrap">
 <div class="word" id="w"><span class="b">Back</span><span class="f" id="f">full</span></div>
 <div class="bar"><div id="o"></div><div id="d"></div><div id="y"></div></div>
 <div class="lab"><span id="l1">Outbound: full</span><span id="l2">Return: fill the gap</span></div>
 <div class="tag" id="tag">Fill empty return trips with small shippers' cargo</div>
</div>
<script>
(function () {
  var D = 6.0;
  var ease = function (t) { return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; };
  var pr = function (s, a, b) { return Math.min(1, Math.max(0, (s - a) / (b - a))); };
  var $ = function (i) { return document.getElementById(i); };
  var Y = [240, 192, 74];
  window.__seek = function (ms) {
    var s = ms / 1000;
    // 0.0〜0.6 秒: 文字が下から現れる
    var a = ease(pr(s, 0.0, 0.6));
    $('w').style.opacity = a;
    $('w').style.transform = 'translateY(' + (24 * (1 - a)) + 'px)';
    // 0.5〜1.3 秒: 行きの白い線（左半分）
    $('o').style.width = (50 * ease(pr(s, 0.5, 1.3))) + '%';
    $('l1').style.opacity = ease(pr(s, 1.0, 1.4));
    // 1.3〜1.8 秒: 帰りの点線（空）
    $('d').style.width = (50 * ease(pr(s, 1.3, 1.8))) + '%';
    // 2.0〜3.0 秒: 帰りを黄色で埋める。同時に full が黄に灯る
    var k = ease(pr(s, 2.0, 3.0));
    $('y').style.width = (50 * k) + '%';
    $('l2').style.opacity = ease(pr(s, 2.2, 2.6));
    var c = [255 + (Y[0] - 255) * k, 255 + (Y[1] - 255) * k, 255 + (Y[2] - 255) * k].map(Math.round);
    $('f').style.color = 'rgb(' + c.join(',') + ')';
    // 3.2 秒: タグライン
    var t = ease(pr(s, 3.2, 3.7));
    $('tag').style.opacity = t;
    $('tag').style.transform = 'translateY(' + (12 * (1 - t)) + 'px)';
    // 最後の 0.4 秒で消える
    $('wrap').style.opacity = 1 - pr(s, D - 0.4, D - 1 / 30);
  };
  window.__seek(0);
  document.fonts.ready.then(function () { window.__seek(0); window.__ready = true; });
})();
</script></body></html>
