<!doctype html><html lang="ja"><head><meta charset="utf-8"><title>CH5</title><link rel="stylesheet" href="../graphics/common.css"><link rel="stylesheet" href="motion.css">
<style>
#band{position:absolute;left:0;top:40px;width:900px;height:220px;background:linear-gradient(90deg,rgba(11,16,22,.85),rgba(11,16,22,0))}
#card{position:absolute;left:96px;top:80px}
#card .n{font-size:40px;color:var(--muted);line-height:1.2}
#card .h{font-size:56px;font-weight:700;line-height:1.3;white-space:nowrap}
#card .ln{height:4px;width:360px;margin-top:14px;background:var(--text);transform-origin:left;transform:scaleX(0)}
</style>
</head><body data-duration="1.8">
<div id="all"><div id="band"></div>
<div id="card"><div class="h">AI でどう作ったか</div><div class="ln" data-grow="0.4,0.4"></div></div></div>
<script src="motion.js"></script>
<script>
(function () {
  var q = window.__seek, all = document.getElementById('all');
  window.__seek = function (ms) {
    q(ms);
    var s = ms / 1000, e = Math.min(1, s / 0.3), k = Math.max(0, Math.min(1, (s - 1.5) / 0.2667));
    var ee = 1 - Math.pow(1 - e, 3);
    all.style.opacity = ee * (1 - k);
    all.style.transform = 'translateX(' + (-20 * (1 - ee)) + 'px)';
  };
  window.__seek(0);
})();
</script></body></html>
