<!doctype html><html lang="ja"><head><meta charset="utf-8"><title>MG8_m</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;background:transparent;overflow:hidden}
body{font-family:"Noto Sans JP","Yu Gothic","Meiryo",sans-serif;color:#fff;font-weight:700}
#stage,.L{position:absolute;left:0;top:0;width:1920px;height:1080px}
.L{transform-origin:96px 160px}
</style></head><body data-duration="6.5">
<div id="stage"><div id="bg" class="L"></div><div id="fig" class="L"></div><div id="txt" class="L"></div></div>
<script src="mkit_m.js"></script>
<script>
(function(){
var K=window.K,P=K.P,E=K.E,D=6.5;
var bg=document.getElementById('bg'),fig=document.getElementById('fig'),txt=document.getElementById('txt');
K.div(bg,'left:0;top:0;width:1920px;height:760px;background:linear-gradient(180deg,rgba(5,8,12,.74) 0%,rgba(5,8,12,.60) 62%,rgba(5,8,12,0) 100%)');
var svg=K.el('svg',{width:1920,height:1080,viewBox:'0 0 1920 1080'},fig);
var CX=520,CY=370,R=230,BXC=1440,LY=CY;
/* 柵: 円の外へ向く短い支柱 */
var ring=K.el('circle',{cx:CX,cy:CY,r:R,fill:'rgba(18,26,35,0)',stroke:'#9fb0c1','stroke-width':6,'stroke-linecap':'round',transform:'rotate(-90 '+CX+' '+CY+')'},svg);
var circ=2*Math.PI*R;ring.setAttribute('stroke-dasharray',circ+' '+circ);
var posts=[],N=28,i;
for(i=0;i<N;i++){
  var a=-Math.PI/2+i/N*2*Math.PI,x1=CX+Math.cos(a)*(R+6),y1=CY+Math.sin(a)*(R+6),x2=CX+Math.cos(a)*(R+26),y2=CY+Math.sin(a)*(R+26);
  posts.push({a:a,n:K.el('line',{x1:x1,y1:y1,x2:x2,y2:y2,stroke:'#9fb0c1','stroke-width':6,'stroke-linecap':'round'},svg),p:i/N});
}
/* 円の中のトラック 6 台 */
var pos=[[-120,-100],[30,-100],[-60,0],[90,0],[-120,100],[30,100]],trs=[];
pos.forEach(function(q){
  var g=K.el('g',{},svg),t=K.truck(g,3.5);t.set('#ffffff',0,0);
  trs.push({g:g,x:CX+q[0]-48,y:CY+q[1]-26});
});
/* 荷主の箱 */
var bg2=K.el('g',{},svg),pc=K.parcel(bg2,4.5);pc.set('#ffffff');
/* 点線: 荷主から円へ向かい、柵で止まる */
var STOP=CX+R+34,LX0=BXC-100;
var dl=K.el('line',{x1:LX0,y1:LY,x2:LX0,y2:LY,stroke:'#9fb0c1','stroke-width':6,'stroke-linecap':'round','stroke-dasharray':'8 22'},svg);
/* ✕ */
var XR=34,xg=K.el('g',{},svg);
var xc=K.el('circle',{cx:CX+R+66,cy:LY,r:44,fill:'#05080c',stroke:'#ffffff','stroke-width':4},xg);
var xa=K.el('line',{x1:CX+R+66-XR/2,y1:LY-XR/2,x2:CX+R+66+XR/2,y2:LY+XR/2,stroke:'#fff','stroke-width':8,'stroke-linecap':'round'},xg);
var xb=K.el('line',{x1:CX+R+66+XR/2,y1:LY-XR/2,x2:CX+R+66-XR/2,y2:LY+XR/2,stroke:'#fff','stroke-width':8,'stroke-linecap':'round'},xg);
/* 文字 */
var l1=K.div(txt,'left:'+(CX-250)+'px;top:'+(CY+R+54)+'px;width:500px;text-align:center;font-size:40px;line-height:1.3','運送会社どうしの掲示板');
var l2=K.div(txt,'left:'+(BXC-200)+'px;top:'+(CY+R+54)+'px;width:400px;text-align:center;font-size:40px;line-height:1.3','小さな荷主');
var big=K.div(txt,'left:0;top:'+(LY-130)+'px;font-size:64px;line-height:1.2;font-weight:900;color:#f0c04a','多くは会員制');
var ul=K.div(txt,'left:0;top:'+(LY-130+80)+'px;height:8px;border-radius:4px;background:#f0c04a;width:0');
var BC=(STOP+BXC-100)/2+40;
big.style.left=(BC-big.offsetWidth/2)+'px';ul.style.left=big.style.left;
function render(s){
  var rp=P(s,.3,1.0,E.mov);
  ring.setAttribute('stroke-dashoffset',circ*(1-rp));
  ring.setAttribute('fill','rgba(18,26,35,'+(.55*P(s,.9,.5))+')');
  /* 衝突で柵がわずかに太くなる（1 回だけ） */
  var hit=P(s,3.3,.15,E.out)*(1-P(s,3.45,.5,E.out));
  ring.setAttribute('stroke-width',6+4*hit);
  posts.forEach(function(o){
    var q=P(s,.4+o.p*.7,.35);
    o.n.style.opacity=q;
    o.n.setAttribute('stroke-width',6+2*hit);
  });
  trs.forEach(function(t,k){
    var q=P(s,.9+k*.08,.4);
    t.g.setAttribute('transform','translate('+t.x+','+(t.y+14*(1-q))+')');
    t.g.setAttribute('opacity',q);
  });
  var bq=P(s,1.3,.5);
  bg2.setAttribute('transform','translate('+(BXC-48)+','+(CY-48+14*(1-bq))+') scale(1.5)');
  bg2.setAttribute('opacity',bq);
  K.show(l1,P(s,1.4,.5),0,14);K.show(l2,P(s,1.6,.5),0,14);
  /* 点線が進む。止まる直前にほんの少し押し戻される */
  var tp=P(s,2.2,1.1,E.mov);
  var endx=K.lerp(LX0,STOP,tp)+9*hit;
  dl.setAttribute('x2',endx);dl.style.opacity=tp>0?1:0;
  /* ✕ */
  var xp=P(s,3.3,.35,E.out);
  xc.setAttribute('r',44*xp);xc.style.opacity=xp>0?1:0;
  var xs=P(s,3.45,.3,E.out);
  var cx=CX+R+66;
  xa.setAttribute('x2',K.lerp(cx-XR/2,cx+XR/2,xs));xa.setAttribute('y2',K.lerp(LY-XR/2,LY+XR/2,xs));
  xb.setAttribute('x2',K.lerp(cx+XR/2,cx-XR/2,P(s,3.6,.3,E.out)));xb.setAttribute('y2',K.lerp(LY-XR/2,LY+XR/2,P(s,3.6,.3,E.out)));
  xa.style.opacity=xs>0?1:0;xb.style.opacity=P(s,3.6,.3)>0?1:0;
  K.show(big,P(s,3.9,.6),0,22);
  ul.style.width=(big.offsetWidth*P(s,4.4,.7,E.mov))+'px';ul.style.opacity=s>4.4?1:0;
}
K.setup(D,render);
})();
</script></body></html>
