<!doctype html><html lang="en"><head><meta charset="utf-8"><title>CHM3_en</title>
<style>
/* 章カード 02。左に暗い帯を敷いて映像の上でも読める。2.4 秒。モーションデザインの決まり 2026-11-07 に従う */
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1920px;height:1080px;background:transparent;overflow:hidden}
body{font-family:"Noto Sans JP","Yu Gothic","Meiryo",sans-serif;color:#fff}
/* 帯は下 300px（字幕の場所）に入らないよう高さ 780px で止め、上下は縁をぼかす */
#strip{position:absolute;left:0;top:0;width:1180px;height:780px;opacity:0;
 background:linear-gradient(90deg,rgba(5,8,12,.80) 0,rgba(5,8,12,.66) 42%,rgba(5,8,12,0) 100%);
 -webkit-mask-image:linear-gradient(180deg,transparent 0,#000 18%,#000 72%,transparent 100%);
 mask-image:linear-gradient(180deg,transparent 0,#000 18%,#000 72%,transparent 100%)}
#blk{position:absolute;left:96px;top:330px;width:900px;height:290px;opacity:1;transform-origin:0 50%}
#num{position:absolute;left:0;top:0;font-size:36px;font-weight:700;color:#9fb0c1;letter-spacing:.14em;font-variant-numeric:tabular-nums;line-height:1;opacity:0}
#title{position:absolute;left:0;top:70px;height:112px;font-size:72px;font-weight:900;line-height:112px;white-space:nowrap;letter-spacing:.01em}
.c{display:inline-block;height:112px;overflow:hidden;vertical-align:top}
.c i{display:block;font-style:normal;opacity:0;white-space:pre}
#rule{position:absolute;left:0;top:218px;width:640px;height:10px}
.s{position:absolute;top:2px;height:6px;border-radius:3px}
#sw{left:0;width:0;background:#fff;box-shadow:0 0 8px rgba(255,255,255,.3)}
#sd{left:244px;width:0;background:repeating-linear-gradient(90deg,#3a4757 0 14px,transparent 14px 30px)}
#sy{left:244px;width:0;background:#f0c04a;box-shadow:0 0 10px rgba(240,192,74,.5)}
</style></head><body data-duration="2.4">
<div id="strip"></div>
<div id="blk">
 <div id="num">02</div>
 <div id="title" data-t="The shipper's problem"></div>
 <div id="rule"><div class="s" id="sw"></div><div class="s" id="sd"></div><div class="s" id="sy"></div></div>
</div>
<script>
(function () {
  function bez(x1, y1, x2, y2) {
    return function (t) {
      if (t <= 0) return 0; if (t >= 1) return 1;
      var lo = 0, hi = 1, m = 0.5;
      for (var i = 0; i < 30; i++) {
        m = (lo + hi) / 2;
        var x = 3 * (1 - m) * (1 - m) * m * x1 + 3 * (1 - m) * m * m * x2 + m * m * m;
        if (x < t) lo = m; else hi = m;
      }
      return 3 * (1 - m) * (1 - m) * m * y1 + 3 * (1 - m) * m * m * y2 + m * m * m;
    };
  }
  var OUT = bez(0.16, 1, 0.3, 1), MOVE = bez(0.65, 0, 0.35, 1), IN = bez(0.7, 0, 0.84, 0);
  var pr = function (s, a, b) { return Math.min(1, Math.max(0, (s - a) / (b - a))); };
  var $ = function (i) { return document.getElementById(i); };
  var D = 2.4;
  var t = $('title'), txt = t.getAttribute('data-t'), chars = [];
  Array.from(txt).forEach(function (ch) {
    var c = document.createElement('span'); c.className = 'c';
    var i = document.createElement('i'); i.textContent = ch; c.appendChild(i); t.appendChild(c); chars.push(i);
  });
  window.__seek = function (ms) {
    var s = ms / 1000;
    // 帯: 0-0.5 秒で現れる
    var ex = pr(s, D - 0.3, D);                 // 最後の 0.3 秒の消え
    var exo = IN(ex);
    $('strip').style.opacity = OUT(pr(s, 0, 0.5)) * (1 - exo);
    // 線: 白い実線 0.10-0.55、点線 0.45-0.80、黄色で埋まる 0.85-1.35
    $('sw').style.width = (244 * OUT(pr(s, 0.10, 0.55))) + 'px';
    $('sd').style.width = (396 * MOVE(pr(s, 0.45, 0.80))) + 'px';
    $('sy').style.width = (396 * MOVE(pr(s, 0.85, 1.35))) + 'px';
    // 文字: 0.04 秒ずつずらして 24px 下から上がる（マスクで切る）
    chars.forEach(function (el, k) {
      var p = OUT(pr(s, 0.22 + k * 0.04, 0.22 + k * 0.04 + 0.6));
      el.style.transform = 'translateY(' + (24 * (1 - p)) + 'px)';
      el.style.opacity = Math.min(1, p * 2.2);
    });
    // 番号
    var n = OUT(pr(s, 0.15, 0.6));
    $('num').style.opacity = n;
    $('num').style.transform = 'translateY(' + (10 * (1 - n)) + 'px)';
    // ゆっくり寄せる（全体で 1.02 倍）と、最後に上へ 12px 動いて消える
    var drift = 1 + 0.02 * (s / D);
    var b = $('blk');
    b.style.transform = 'translateY(' + (-12 * exo) + 'px) scale(' + drift + ')';
    b.style.opacity = 1 - exo;
  };
  window.__seek(0);
  document.fonts.ready.then(function () { window.__seek(0); window.__ready = true; });
})();
</script></body></html>
