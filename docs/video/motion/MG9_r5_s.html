<!doctype html><html lang="ja"><head><meta charset="utf-8"><title>MG9</title><link rel="stylesheet" href="../graphics/common.css"><link rel="stylesheet" href="motion.css">
<style>
/* 使われていない能力の内訳（営業用普通車、自動車輸送統計年報 2025 年度の付表から計算: 実車率 62.15%、積載効率 39.08%） */
.pnl{position:absolute;left:50%;top:70px;transform:translateX(-50%);width:1100px;padding:40px 52px 44px;background:rgba(18,26,35,.92);border:1px solid var(--line);border-radius:12px}
h1{font-size:44px;margin:0 0 30px}
.bar{position:relative;height:66px;border-radius:8px;overflow:hidden;background:#1d2833;display:flex}
.seg{height:66px;width:0}
.used{background:#8a99a8}
.empty{background:var(--warn)}
.gap{background:#3f5163}
.lab{display:flex;margin-top:16px;font-size:30px;color:var(--muted)}
.lab div{opacity:0}
.big{margin-top:34px;font-size:52px;font-weight:800;opacity:0}
.big .y{color:var(--warn)}
</style></head><body data-duration="9.0">
<div class="pnl" id="p">
 <h1>トラックの積める量のうち使っていない分の内訳</h1>
 <div class="bar"><div class="seg used" id="s1"></div><div class="seg empty" id="s2"></div><div class="seg gap" id="s3"></div></div>
 <div class="lab"><div id="l1" style="width:39.1%">使っている 39%</div><div id="l2" style="width:37.9%;color:var(--warn)">荷を積まずに走る</div><div id="l3" style="width:23%">積載中の空き</div></div>
 <div class="big" id="b">使っていない分の <span class="y">約 6 割</span> は空で走る距離</div>
</div>
<script>
(function () {
  var D = 9.0, ease = function (t) { return 1 - Math.pow(1 - t, 3); };
  var pr = function (s, a, b) { return Math.min(1, Math.max(0, (s - a) / (b - a))); };
  var $ = function (i) { return document.getElementById(i); };
  window.__seek = function (ms) {
    var s = ms / 1000;
    var a = ease(pr(s, 0, 0.35));
    $('p').style.opacity = a * (1 - pr(s, D - 0.3, D - 1 / 30));
    $('p').style.transform = 'translateX(-50%) translateY(' + (24 * (1 - a)) + 'px)';
    $('s1').style.width = (39.1 * ease(pr(s, 0.4, 1.2))) + '%';
    $('s2').style.width = (37.9 * ease(pr(s, 1.6, 2.4))) + '%';
    $('s3').style.width = (23.0 * ease(pr(s, 2.6, 3.2))) + '%';
    $('l1').style.opacity = pr(s, 0.9, 1.3);
    $('l2').style.opacity = pr(s, 2.1, 2.5);
    $('l3').style.opacity = pr(s, 3.0, 3.4);
    var k = ease(pr(s, 3.8, 4.3));
    $('b').style.opacity = k;
    $('b').style.transform = 'translateY(' + (12 * (1 - k)) + 'px)';
  };
  window.__seek(0);
  document.fonts.ready.then(function () { window.__seek(0); window.__ready = true; });
})();
</script></body></html>
