<!doctype html><html lang="en"><head><meta charset="utf-8"><title>MGH3_m_en</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;background:transparent;overflow:hidden}
body{font-family:"Noto Sans JP","Yu Gothic","Meiryo",sans-serif;color:#fff;line-height:1.3}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px}
.layer{position:absolute;left:0;top:0;width:1920px;height:1080px}
svg{position:absolute;left:0;top:0;overflow:visible}
.sh{text-shadow:0 4px 22px rgba(0,0,0,.65),0 0 5px rgba(0,0,0,.45)}
</style></head><body data-duration="6.6">
<div id="stage"><div class="layer" id="bg"></div><div class="layer" id="fig"></div><div class="layer" id="txt"></div></div>
<script src="mkit_m.js"></script>
<script>
/* H3「もし、その空いた帰りの荷台に、小さな荷主の荷物を、載せられたら。」の図（r16）。
   r15 まではガラスの器の実写で、荷台が映らなかった（タイミングの点検 r15 の P1）。
   0 秒 = 「もし」の 0.3 秒前（build の at say「もし」land 0.3）。各項目は H3 の声の時刻（tight_r9、1.1 倍）に合わせる:
   「その空いた」1.03 秒、「小さな荷主」3.42 秒、「載せられたら」5.02 秒 */
(function () {
  var K = window.K, P = K.P, E = K.E, D = 6.6;
  var TM = {truck: 0.1, empty: 1.5, drop: 3.4, fill: 4.8};  /* 英語版: 0 秒 = 「What if」の 0.3 秒前。「that empty」1.33、「could carry」3.16、「goods」4.46（tight_en、1.05 倍） */
  var WHITE = '#ffffff', YEL = '#f0c04a', MUT = '#9fb0c1';
  var fig = document.getElementById('fig'), txt = document.getElementById('txt');
  var sv = K.el('svg', { width: 1920, height: 1080, viewBox: '0 0 1920 1080' }, fig);
  var g = K.el('g', {}, sv);
  /* トラック: 荷台 640x280、運転席は右 */
  var CX = 560, CY = 340, CW = 640, CH = 280;
  var cargo = K.el('rect', { x: CX, y: CY, width: CW, height: CH, rx: 10, fill: 'rgba(240,192,74,0)', stroke: YEL, 'stroke-width': 6, 'stroke-dasharray': '18 14' }, g);
  var cab = K.el('path', { d: 'M' + (CX + CW + 14) + ' ' + (CY + 70) + ' h120 l70 90 v120 h-190 z', fill: 'none', stroke: WHITE, 'stroke-width': 6, 'stroke-linejoin': 'round' }, g);
  var win = K.el('path', { d: 'M' + (CX + CW + 40) + ' ' + (CY + 96) + ' h84 l44 58 h-128 z', fill: 'none', stroke: WHITE, 'stroke-width': 4, 'stroke-linejoin': 'round' }, g);
  var base = K.el('line', { x1: CX - 10, y1: CY + CH + 14, x2: CX + CW + 214, y2: CY + CH + 14, stroke: WHITE, 'stroke-width': 6, 'stroke-linecap': 'round' }, g);
  var wheels = [CX + 120, CX + 470, CX + CW + 120].map(function (x) {
    return K.el('circle', { cx: x, cy: CY + CH + 46, r: 30, fill: '#0b1016', stroke: WHITE, 'stroke-width': 6 }, g);
  });
  /* 小さな荷物 3 つ（荷台の左下から） */
  var boxes = [0, 1, 2].map(function (i) {
    var w = 120, h = 100, x = CX + 40 + i * 150, y = CY + CH - h - 18;
    var b = K.el('g', {}, g);
    K.el('rect', { x: x, y: y, width: w, height: h, rx: 6, fill: '#f6e3b0', stroke: '#c9a24e', 'stroke-width': 4 }, b);
    K.el('line', { x1: x + w / 2, y1: y, x2: x + w / 2, y2: y + h, stroke: '#c9a24e', 'stroke-width': 4 }, b);
    return { g: b, x: x, y: y };
  });
  function T(y, size, weight, color, html) {
    var d = K.div(txt, 'left:0;width:1920px;top:' + y + 'px;text-align:center;font-size:' + size + 'px;font-weight:' + weight + ';color:' + color + ';letter-spacing:.03em', html);
    d.className = 'sh'; d.style.opacity = 0; return d;
  }
  var f1 = T(170, 58, 800, WHITE, '<span style="color:' + YEL + '">The empty space</span> on the way home');
  var f2 = T(770, 58, 800, WHITE, 'a small shipper’s goods');
  var f3 = T(860, 46, 700, YEL, 'could ride along');
  function render(s) {
    var p = P(s, TM.truck, 0.6, E.out);
    g.style.opacity = p;
    g.setAttribute('transform', 'translate(0 ' + (16 * (1 - p)) + ')');
    /* 空の荷台を点滅気味に強調 */
    var pe = P(s, TM.empty, 0.6);
    cargo.setAttribute('stroke-width', 6 + 3 * pe);
    K.show(f1, pe, 0, 18);
    /* 荷物が上から落ちて収まる */
    boxes.forEach(function (b, i) {
      var q = P(s, TM.drop + 0.28 * i, 0.45, E.out);
      b.g.style.opacity = q;
      b.g.setAttribute('transform', 'translate(0 ' + (-220 * (1 - q)) + ')');
    });
    K.show(f2, P(s, TM.drop, 0.5), 0, 18);
    /* 載った: 荷台がうっすら黄色に埋まる */
    var pf = P(s, TM.fill, 0.7);
    cargo.setAttribute('fill', 'rgba(240,192,74,' + (0.22 * pf) + ')');
    cargo.setAttribute('stroke-dasharray', pf > 0.5 ? 'none' : '18 14');
    K.show(f3, pf, 0, 16);
  }
  K.setup(D, render);
})();
</script></body></html>
