<!doctype html><html lang="ja"><head><meta charset="utf-8"><title>LOGO</title><link rel="stylesheet" href="../graphics/common.css"><link rel="stylesheet" href="motion.css">
<style>
@font-face{font-family:"SegoeScriptB";src:url("file:///C:/Windows/Fonts/segoescb.ttf")}
html,body{background:#05080c}
#all{position:absolute;left:0;top:0;width:1920px;height:1080px}
#tx{position:absolute;left:0;right:0;top:250px;text-align:center;font-family:"SegoeScriptB","Segoe Script",cursive;font-weight:700;font-size:240px;line-height:1.3;color:#fff;transform:rotate(-6deg);white-space:nowrap}
#tx span{display:inline-block}
.ln{position:absolute;height:3px;border-radius:2px;background:#fff}
#tag{position:absolute;left:0;right:0;top:640px;text-align:center;font-size:44px;color:var(--muted);opacity:0}
</style>
</head><body data-duration="6.0">
<div id="all"><div id="ll" class="ln"></div><div id="rl" class="ln"></div><div id="tx"><span id="t">Backfull</span></div></div>
<div id="tag">帰りの荷台を、中小の荷主の荷で埋める</div>
<script>
(function () {
  var D = 6.0, ease = function (t) { return 1 - Math.pow(1 - t, 3); };
  var pr = function (s, a, b) { return Math.min(1, Math.max(0, (s - a) / (b - a))); };
  var $ = function (i) { return document.getElementById(i); };
  var all = $('all'), tx = $('tx'), t = $('t'), tag = $('tag'), ll = $('ll'), rl = $('rl');
  function layout() {
    // 回転の前の位置で測る（回転は文字だけ。線は水平のまま文字の左右につなぐ）
    tx.style.transform = 'none';
    var r = t.getBoundingClientRect();
    tx.style.transform = 'rotate(-6deg)';
    var cy = r.top + r.height * 0.62;
    ll.style.left = '0px'; ll.style.width = (r.left + 40) + 'px'; ll.style.top = (cy + 26) + 'px';
    rl.style.left = (r.right - 40) + 'px'; rl.style.width = (1920 - r.right + 40) + 'px'; rl.style.top = (cy - 26) + 'px';
  }
  function glow(g) {
    var c = 'rgba(159,212,255,';
    tx.style.textShadow = '0 0 6px ' + c + (0.95 * g) + '),0 0 18px ' + c + (0.85 * g) + '),0 0 40px ' + c + (0.65 * g) + '),0 0 90px ' + c + (0.45 * g) + ')';
    var f = 'drop-shadow(0 0 8px ' + c + (0.9 * g) + ')) drop-shadow(0 0 26px ' + c + (0.6 * g) + '))';
    [ll, rl].forEach(function (e) { e.style.filter = f; e.style.opacity = 0.35 + 0.65 * g; });
  }
  function flick(s) { // 1.6〜2.0 秒に 2 回だけ小さく暗くなる
    if (s < 1.6 || s >= 2.0) return 1;
    var p = (s - 1.6) / 0.4;
    return (p < 0.18 || (p >= 0.34 && p < 0.55)) ? 0.5 : 1;
  }
  window.__seek = function (ms) {
    var s = ms / 1000, x = pr(s, 0, 1.6) * 1920;
    all.style.clipPath = 'inset(0 ' + (1920 - x) + 'px 0 0)';
    glow(flick(s));
    var k = ease(pr(s, 2.4, 2.8)), out = 1 - pr(s, D - 0.4, D - 1 / 30);
    all.style.opacity = out;
    tag.style.opacity = k * out;
    tag.style.transform = 'translateY(' + (12 * (1 - k)) + 'px)';
  };
  layout(); window.__seek(0);
  document.fonts.ready.then(function () { layout(); window.__seek(0); window.__ready = true; });
})();
</script></body></html>
