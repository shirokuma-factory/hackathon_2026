<!doctype html><html lang="ja"><head><meta charset="utf-8"><title>G4</title><link rel="stylesheet" href="common.css">
<style>
.cols{display:flex;gap:56px}
.col{flex:1}
.col h2{font-size:48px;margin-bottom:18px;padding-bottom:14px;border-bottom:4px solid}
.col.a h2{border-color:var(--ok)}.col.b h2{border-color:var(--warn)}
.item{display:flex;gap:20px;align-items:baseline;font-size:40px;padding:18px 0;border-bottom:2px solid var(--line)}
.item .m{width:56px;text-align:center;font-size:46px;flex:none}
.item span.s{display:block;font-size:32px;color:var(--muted)}
</style></head><body>
<h1>今日できること、まだのこと</h1>
<div class="cols">
<div class="col a"><h2><span class="ok">○</span> できること</h2>
<div class="item"><span class="m ok">○</span><div>偏りの地図<span class="s">国の統計</span></div></div>
<div class="item"><span class="m ok">○</span><div>自社の帰りの空き<span class="s">自社の CSV か、見本の配車表</span></div></div>
<div class="item"><span class="m ok">○</span><div>荷待ちの額・場所・相談の書面</div></div>
<div class="item"><span class="m ok">○</span><div>送り方の比べ</div></div>
<div class="item"><span class="m ok">○</span><div>架空の便での照合・仮予約・承諾</div></div>
</div>
<div class="col b"><h2><span class="warn">△</span> まだのこと</h2>
<div class="item"><span class="m warn">△</span><div>Excel の直接の取り込み<span class="s">今は CSV で読む</span></div></div>
<div class="item"><span class="m warn">△</span><div>帰り便の実際の供給<span class="s">今は架空の便</span></div></div>
<div class="item"><span class="m warn">△</span><div>実在の会社での確認<span class="s">協力する会社が未定</span></div></div>
</div></div>
</body></html>
