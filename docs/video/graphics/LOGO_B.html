<!doctype html><html lang="ja"><head><meta charset="utf-8"><title>LOGO_B</title><link rel="stylesheet" href="common.css">
<style>
html,body{background:#05080c}
body{padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center;height:1080px}
.word{font-weight:800;font-size:190px;letter-spacing:-0.02em;line-height:1;margin-top:-120px}
.word .b{color:#fff}.word .f{color:var(--warn)}
.bar{position:relative;width:860px;height:14px;margin-top:34px}
.bar .o{position:absolute;left:0;top:0;width:50%;height:14px;border-radius:7px;background:#fff}
.bar .d{position:absolute;left:50%;top:0;width:50%;height:14px;border-radius:7px;background:repeating-linear-gradient(90deg,#3a4757 0 14px,transparent 14px 30px)}
.bar .y{position:absolute;left:50%;top:0;width:34%;height:14px;border-radius:7px;background:var(--warn)}
.lab{display:flex;justify-content:space-between;width:860px;font-size:28px;color:var(--muted);margin-top:14px}
.tag{margin-top:40px;font-size:40px;color:var(--muted);letter-spacing:0.08em}
</style></head><body>
<div class="word"><span class="b">Back</span><span class="f">full</span></div>
<div class="bar"><div class="o"></div><div class="d"></div><div class="y"></div></div>
<div class="lab"><span>行き　満載</span><span>帰り　空きを埋める</span></div>
<div class="tag">帰りの荷台を　中小の荷主の荷で埋める</div>
</body></html>
